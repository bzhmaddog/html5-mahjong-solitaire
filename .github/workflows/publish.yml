name: Publish to GitHub Pages

# Deploys the site when a GitHub Release is published.
#
# The github-pages environment only accepts deployments from main, and a run
# started by a release runs from its tag. So the release run only checks the
# release and re-dispatches this workflow on main; that main run deploys.
#
# Only the repository's "Latest" release is deployed: drafts, pre-releases and
# releases published with "Set as the latest release" unticked are skipped.
# Running the workflow manually (re)deploys the current latest release.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Release run: hand over to a run on main.
  dispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          latest=$(gh release view --json tagName --jq .tagName)
          if [ "$RELEASE_TAG" != "$latest" ]; then
            echo "::notice::$RELEASE_TAG is not the latest release ($latest), skipping deploy."
            exit 0
          fi
          gh workflow run publish.yml --ref main
          echo "::notice::Deploy of $RELEASE_TAG started in a new run on main."

  # Run on main (dispatched above, or started manually): find what to deploy.
  latest-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [ -z "$latest" ]; then
            echo "::error::No published GitHub release found."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$latest" origin/main; then
            echo "::error::$latest is not on main, refusing to deploy."
            exit 1
          fi
          echo "Deploying $latest"
          echo "tag=$latest" >> "$GITHUB_OUTPUT"

  publish:
    needs: latest-release
    if: needs.latest-release.outputs.tag != ''
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.latest-release.outputs.tag }}
          fetch-depth: 0 # full history + tags, needed for the version shown on the home page

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - id: deployment
        uses: actions/deploy-pages@v4
